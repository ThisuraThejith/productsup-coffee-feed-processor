services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: productsup_coffee_feed_processor
        working_dir: /app
        volumes:
            - ./:/app
            - vendor:/app/vendor
        tty: true
        command: php bin/console app:flatten-coffee-feed input/coffee_feed.jsonl var/output/coffee_feed.sqlite

volumes:
    vendor:
